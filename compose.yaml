name: ato-m0
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ato
      POSTGRES_USER: ato
      POSTGRES_PASSWORD: ${ATO_DB_PASSWORD:?Ejecute primero scripts/dev-env.py}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ato -d ato"]
      interval: 5s
      timeout: 3s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${ATO_KEYCLOAK_ADMIN_PASSWORD:?Ejecute primero scripts/dev-env.py}
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./.m0-local/ato-realm.json:/opt/keycloak/data/import/ato-realm.json:ro
      - ./infra/keycloak/themes/ato:/opt/keycloak/themes/ato:ro
      - keycloak-data:/opt/keycloak/data
  clamav:
    profiles: ["m1"]
    image: clamav/clamav:1.4.6
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-signatures:/var/lib/clamav
      - ./infra/clamd.conf:/etc/clamav/clamd.conf:ro
volumes:
  clamav-signatures:
  postgres-data:
  keycloak-data:
