spring.application.name=atoconstrucciones
spring.datasource.url=${ATO_DB_URL}
spring.datasource.username=${ATO_DB_USER:ato}
spring.datasource.password=${ATO_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.clean-disabled=true
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
spring.docker.compose.enabled=false
spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
# Nunca registrar payloads, tokens ni SQL con datos privados en entornos reales.
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc=INFO
server.servlet.session.cookie.name=ATOSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
server.shutdown=graceful
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
spring.security.oauth2.client.registration.ato.provider=ato
spring.security.oauth2.client.registration.ato.client-id=${ATO_OIDC_CLIENT_ID:ato-web}
spring.security.oauth2.client.registration.ato.client-secret=${ATO_OIDC_CLIENT_SECRET}
spring.security.oauth2.client.registration.ato.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.ato.scope=openid,profile,email
spring.security.oauth2.client.registration.ato.redirect-uri=${ATO_WEB_ORIGIN}/login/oauth2/code/ato
spring.security.oauth2.client.provider.ato.issuer-uri=${ATO_OIDC_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ATO_OIDC_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=ato-api
ato.web-origin=${ATO_WEB_ORIGIN}
ato.security.require-mfa=${ATO_REQUIRE_MFA:false}
ato.bootstrap-manager-email=${ATO_BOOTSTRAP_MANAGER_EMAIL:}
ato.jobs.enabled=true
ato.jobs.poll-ms=2000
ato.jobs.max-attempts=5
ato.jobs.lease-seconds=60
ato.storage.enabled=${ATO_STORAGE_ENABLED:false}
ato.storage.drive.folder-id=${ATO_DRIVE_FOLDER_ID:}
ato.storage.drive.credentials-file=${ATO_DRIVE_CREDENTIALS_FILE:}
ato.storage.drive.scope=${ATO_DRIVE_SCOPE:https://www.googleapis.com/auth/drive.file}
ato.scanner.host=${ATO_SCANNER_HOST:127.0.0.1}
ato.scanner.port=${ATO_SCANNER_PORT:3310}
ato.scanner.require-fresh=true
ato.scanner.max-age-hours=72
ato.documents.worker-enabled=${ATO_DOCUMENT_WORKER_ENABLED:true}
ato.documents.poll-ms=2000

# M4: sin envío externo hasta configurar cuenta/remitente y habilitar explícitamente.
ato.mail.enabled=${ATO_MAIL_ENABLED:false}
ato.mail.username=${ATO_GMAIL_USERNAME:}
ato.mail.password=${ATO_GMAIL_APP_PASSWORD:}
ato.mail.recipient=${ATO_MAIL_RECIPIENT:}
ato.mail.sender-confirmed=${ATO_MAIL_SENDER_CONFIRMED:false}
ato.contact.rate-secret=${ATO_CONTACT_RATE_SECRET:local-development-only}
ato.contact.trusted-tunnel=${ATO_CONTACT_TRUSTED_TUNNEL:false}
ato.contact.worker-enabled=${ATO_CONTACT_WORKER_ENABLED:true}

# Altas nuevas en Keycloak: cliente de servicio separado, sin contraseñas de personas.
ato.accounts.provisioning-enabled=${ATO_ACCOUNT_PROVISIONING_ENABLED:false}
ato.accounts.client-id=${ATO_ACCOUNT_CLIENT_ID:ato-accounts}
ato.accounts.client-secret=${ATO_ACCOUNT_CLIENT_SECRET:}
ato.accounts.activation-worker-enabled=${ATO_ACCOUNT_ACTIVATION_WORKER_ENABLED:true}
